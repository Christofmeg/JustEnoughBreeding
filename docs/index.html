<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JustEnoughBreeding Integration Generator</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --input-bg: #f0f0f0;
      --input-fg: #000000;
      --border: #cccccc;
      --accent: #4caf50;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #f0f0f0;
        --input-bg: #2a2a2a;
        --input-fg: #ffffff;
        --border: #444444;
        --accent: #81c784;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      margin: 2em;
      max-width: 800px;
    }

    textarea, input, select {
      background-color: var(--input-bg);
      color: var(--input-fg);
      border: 1px solid var(--border);
      padding: 0.5em;
      margin-bottom: 1em;
      width: 100%;
      font-size: 1em;
    }

    label {
      font-weight: bold;
      margin-top: 1em;
      display: block;
    }

    button {
      background-color: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.6em 1.2em;
      font-size: 1em;
      cursor: pointer;
      border-radius: 0.25em;
      margin-top: 1em;
    }

    button:hover {
      opacity: 0.9;
    }

    .output {
      margin-top: 1.5em;
    }

    .hidden {
      display: none;
    }

    h1 {
      font-size: 1.6em;
    }

    h2 {
      font-size: 1.2em;
      margin-top: 2em;
    }

    .group {
      border: 1px solid var(--border);
      padding: 1em;
      border-radius: 8px;
      margin-top: 1em;
    }

    .inline-flex > * {
      flex: 1;
    }

    .checkbox-button {
      display: inline-block;
      background-color: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.6em 1.2em;
      font-size: 1em;
      cursor: pointer;
      border-radius: 0.25em;
      margin-top: 0.5em;
      text-align: center;
      user-select: none;
      font-weight: normal; /* remove bold */
    }

    .checkbox-button:hover {
      opacity: 0.9;
    }

    .checkbox-button input {
      display: none; /* hide default checkbox */
    }

  </style>
</head>
<body>
<h1>JustEnoughBreeding Integration Generator</h1>

<label for="providerType">Recipe Type (Provider):</label>
<select id="providerType" onchange="toggleOptionalFields()">
  <option value="allay_duplication">allay_duplication</option>
  <option value="breeding">breeding</option>
  <option value="taming">taming</option>
  <option value="temper">temper</option>
  <option value="transformation">transformation</option>
  <option value="trusting">trusting</option>
</select>

<label for="modId">Mod ID:</label>
<input type="text" id="modId" value="minecraft" />

<div class="group" id="mobIdGroup">
  <label for="mobId">Mob ID:</label>
  <input type="text" id="mobId" value="bee" />
</div>

<div class="group">
  <div id="inputs"></div>
  <button type="button" onclick="addInput('inputs')">+ Input</button>
</div>

<div class="group" id="extraInputsGroup">
  <div id="extraInputs"></div>
  <button type="button" onclick="addInput('extraInputs')">+ Additional Input</button>
</div>

<div class="group" id="outputsGroup">
  <div id="outputs"></div>
  <button type="button" onclick="addInput('outputs')">+ Output</button>
</div>

<div class="group" id="spawnEggsGroup">
  <div id="spawn_eggs"></div>
  <button type="button" onclick="addInput('spawn_eggs')">+ Custom Spawn Egg</button>
</div>

<div class="group hidden" id="tamingGroup">
  <label class="checkbox-button" id="tamedLabel">
    <input type="checkbox" id="tamedCheckbox" /> Needs to be tamed
  </label>
</div>

<div class="group hidden" id="trustingGroup">
  <label class="checkbox-button" id="trustingLabel">
    <input type="checkbox" id="trustingCheckbox" /> Needs to trust player
  </label>
</div>

<div class="group hidden" id="inputEntityGroup">
  <label for="inputEntity">Input Entity:</label>
  <input type="text" id="inputEntity" placeholder="minecraft:bee" />
</div>

<div class="group hidden" id="inputSpawnEggsGroup">
  <div id="input_spawn_eggs"></div>
  <button type="button" onclick="addInput('input_spawn_eggs')">+ Input Spawn Eggs</button>
</div>

<div class="group hidden" id="outputEntityGroup">
  <label for="outputEntity">Output Entity:</label>
  <input type="text" id="outputEntity" placeholder="minecraft:pig" />
</div>

<div class="group hidden" id="outputEntityNBTGroup">
  <div id="output_entity_nbt"></div>
  <button type="button" onclick="addNBTInput('output_entity_nbt')">+ Output Entity NBT</button>
</div>

<div class="group hidden" id="outputSpawnEggsGroup">
  <div id="output_spawn_eggs"></div>
  <button type="button" onclick="addInput('output_spawn_eggs')">+ Output Spawn Eggs</button>
</div>

<button onclick="generateRecipe()">Generate</button>
<button onclick="downloadRecipe()">Download JSON</button>

<div class="output">
  <h2>📝 Generated JSON:</h2>
  <label for="outputArea"></label><textarea id="outputArea" readonly></textarea>
</div>

<script>
  function createInputRow(containerId) {
    const div = document.createElement('div');
    div.className = 'inline-flex';

    const typeSelect = document.createElement('select');
    let types;

    if (containerId === 'inputs' || containerId === 'extraInputs') {
      types = ['item', 'tag', 'meat'];
    } else {
      types = ['item', 'tag'];
    }

    types.forEach(type => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      typeSelect.appendChild(opt);
    });

    const valueInput = document.createElement('input');
    if (containerId === 'spawn_eggs' || containerId === 'input_spawn_eggs' || containerId === 'output_spawn_eggs') {
      valueInput.placeholder = 'minecraft:bee_spawn_egg'
    } else {
      valueInput.placeholder = 'minecraft:carrot'
    }

    typeSelect.addEventListener('change', () => {
      if (typeSelect.value === 'meat') {
        valueInput.placeholder = '(true/false) All meat including Rotten Flesh';
      } else if (typeSelect.value === 'tag') {
        valueInput.placeholder = 'minecraft:flowers';
      } else if (typeSelect.value === 'item') {
        if (containerId === 'spawn_eggs' || containerId === 'input_spawn_eggs' || containerId === 'output_spawn_eggs') {
          valueInput.placeholder = 'minecraft:bee_spawn_egg'
        } else {
          valueInput.placeholder = 'minecraft:carrot'
        }
      }
    });

    // ✅ append in correct order
    div.appendChild(typeSelect);
    div.appendChild(valueInput);

    if (containerId === 'outputs') {
      const minInput = document.createElement('input');
      minInput.type = 'number';
      minInput.placeholder = 'min';
      minInput.style.maxWidth = '80px';

      const maxInput = document.createElement('input');
      maxInput.type = 'number';
      maxInput.placeholder = 'max';
      maxInput.style.maxWidth = '80px';

      div.appendChild(minInput);
      div.appendChild(maxInput);
    }

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.className = 'remove-button';
    removeBtn.onclick = () => div.remove();

    div.appendChild(removeBtn);
    document.getElementById(containerId).appendChild(div);
  }

    function addInput(containerId) {
      createInputRow(containerId);
    }

  function addNBTInput(containerId) {
    const div = document.createElement('div');
    div.className = 'inline-flex';

    // NBT KEY input
    const keyInput = document.createElement('input');
    keyInput.placeholder = 'NBT Key (e.g. Color)';
    keyInput.style.maxWidth = '140px';

    // NBT VALUE input
    const valueInput = document.createElement('input');
    valueInput.placeholder = 'Value (e.g. 2, "Bob", true)';
    valueInput.style.maxWidth = '180px';

    // Remove button
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.className = 'remove-button';
    removeBtn.onclick = () => div.remove();

    // Append in correct order
    div.appendChild(keyInput);
    div.appendChild(valueInput);
    div.appendChild(removeBtn);

    document.getElementById(containerId).appendChild(div);
  }

  function collectInputs(containerId) {
    const result = [];
    const container = document.getElementById(containerId);
    container.querySelectorAll('.inline-flex').forEach(row => {
      const children = Array.from(row.querySelectorAll('select, input'));
      const select = children[0];
      const valueInput = children[1];
      const minInput = children[2];
      const maxInput = children[3];

      const type = select.value;
      const value = valueInput.value.trim();

      if (!value) return; // skip empty rows

      let entry;
      if (type === 'meat') {
        entry = { meat: value };
      } else {
        entry = { [type]: value };
      }

      if (containerId === 'outputs') {
        let minVal = minInput?.value ? parseInt(minInput.value, 10) : null;
        let maxVal = maxInput?.value ? parseInt(maxInput.value, 10) : null;

        if (minVal === null && maxVal === null) {
          // no amount
        } else if (minVal === null && maxVal !== null) {
          // only max filled → default min=1
          entry.amount = { min: 1, max: maxVal };
        } else if (minVal !== null && maxVal === null) {
          // only min filled → fixed value (min=max)
          if (minVal !== 1) {
            entry.amount = { min: minVal, max: minVal };
          }
        } else {
          // both filled
          if (minVal > maxVal) {
            entry.amount = { min: minVal, max: minVal };
          } else if (minVal === 1 && maxVal === 1) {
            // skip amount
          } else if (minVal === maxVal && minVal > 1) {
            entry.amount = { min: minVal, max: minVal };
          } else {
            entry.amount = { min: minVal, max: maxVal };
          }
        }
      }

      result.push(entry);
    });
    return result;
  }

  function collectNBT(containerId) {
    const container = document.getElementById(containerId);
    const rows = container.querySelectorAll('div');

    const nbt = {}; // <── return ONE object

    rows.forEach(div => {
      const [keyInput, valueInput] = div.querySelectorAll('input');
      const key = keyInput.value.trim();
      let value = valueInput.value.trim();

      if (!key) return;

      // Parse value → number, boolean, or string
      if (value === 'true') value = true;
      else if (value === 'false') value = false;
      else if (!isNaN(value)) value = Number(value);
      else if (
        (value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))
      ) {
        value = value.slice(1, -1);
      }

      nbt[key] = value; // <── merge into ONE object
    });

    return nbt;
  }

  function toggleOptionalFields() {
    const provider = document.getElementById('providerType').value;
    const tamingGroup = document.getElementById('tamingGroup');
    const trustingGroup = document.getElementById('trustingGroup');
    const tamed = document.getElementById('tamedCheckbox');
    const trusting = document.getElementById('trustingCheckbox');

    if (provider === 'breeding' || provider === 'transformation') {
      tamingGroup.classList.remove('hidden');
      trustingGroup.classList.remove('hidden');
    } else {
      tamingGroup.classList.add('hidden');
      tamed.checked = false;
      trustingGroup.classList.add('hidden');
      trusting.checked = false;
    }

	if (provider === 'transformation') {
	  mobIdGroup.classList.add('hidden');
		extraInputsGroup.classList.add('hidden');
		spawnEggsGroup.classList.add('hidden');
		outputsGroup.classList.add('hidden');
		inputEntityGroup.classList.remove('hidden');
		inputSpawnEggsGroup.classList.remove('hidden');
		outputEntityGroup.classList.remove('hidden');
		outputEntityNBTGroup.classList.remove('hidden');
		outputSpawnEggsGroup.classList.remove('hidden');
	} else {
	  mobIdGroup.classList.remove('hidden');
		extraInputsGroup.classList.remove('hidden');
		spawnEggsGroup.classList.remove('hidden');
		outputsGroup.classList.remove('hidden');
		inputEntityGroup.classList.add('hidden');
		inputSpawnEggsGroup.classList.add('hidden');
		outputEntityGroup.classList.add('hidden');
		outputEntityNBTGroup.classList.add('hidden');
		outputSpawnEggsGroup.classList.add('hidden');
	}

    document.getElementById('tamedLabel').classList.toggle('active', tamed.checked);
    document.getElementById('trustingLabel').classList.toggle('active', trusting.checked);
  }

  function setupExclusiveCheckboxes() {
    const tamed = document.getElementById('tamedCheckbox');
    const trusting = document.getElementById('trustingCheckbox');
    const tamedLabel = document.getElementById('tamedLabel');
    const trustingLabel = document.getElementById('trustingLabel');

    function updateStyles() {
      tamedLabel.classList.toggle('active', tamed.checked);
      trustingLabel.classList.toggle('active', trusting.checked);
    }

    tamed.addEventListener('change', () => {
      if (tamed.checked) trusting.checked = false;
      updateStyles();
    });

    trusting.addEventListener('change', () => {
      if (trusting.checked) tamed.checked = false;
      updateStyles();
    });

    // initial state
    updateStyles();
  }

  function autoResizeTextarea(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
  }

  function generateRecipe() {
    const provider = document.getElementById('providerType').value;
    const modId = document.getElementById('modId').value.trim();
    const mobId = document.getElementById('mobId').value.trim();
    const inputs = collectInputs('inputs');
    const extraInputs = collectInputs('extraInputs');
    const outputs = collectNBT('output_entity_nbt');
    const spawnEggs = collectInputs('spawn_eggs');

    const mobData = {};
		if (inputs.length) mobData.inputs = inputs;
		if (extraInputs.length) mobData.extra_inputs = extraInputs;
		if (outputs.length) mobData.outputs = outputs;
		if (spawnEggs.length) mobData.spawn_eggs = spawnEggs;

		if (document.getElementById('tamedCheckbox').checked) {
		  mobData.tamed = true;
		}
		if (document.getElementById('trustingCheckbox').checked) {
		  mobData.trusting = true;
		}

		let recipe = {
		  type: 'justenoughbreeding:' + provider,
		  mod: modId,
		  mobs: [
			{ [mobId]: mobData }
		  ]
		};

	if (provider === 'transformation') {
    const inputEntityId = document.getElementById('inputEntity').value.trim();
    const spawnEggInputs = collectInputs('input_spawn_eggs');
    const outputEntityId = document.getElementById('outputEntity').value.trim();
    const outputEntityNBT = collectInputs('output_entity_nbt');
    const spawnEggOutputs = collectInputs('output_spawn_eggs');

    recipe = {
      type: 'justenoughbreeding:' + provider,
      mod: modId,
      inputs: inputs,
      input_entity: inputEntityId,
      input_spawn_eggs: spawnEggInputs,
      output_entity: outputEntityId,
      output_entity_nbt: outputEntityNBT,
      output_spawn_eggs: spawnEggOutputs,
      ...mobData
    };
  }

    const outputArea = document.getElementById('outputArea');
    outputArea.value = JSON.stringify(recipe, null, 2);
    autoResizeTextarea(outputArea);
  }

    function downloadRecipe() {
      generateRecipe();
      const content = document.getElementById('outputArea').value;
      let filename = document.getElementById('mobId').value.trim() || "recipe";
      const provider = document.getElementById('providerType').value;

      if (provider === 'transformation') {
          try {
            const json = JSON.parse(content);
            if (json.output_entity) {
              const parts = json.output_entity.split(':');
              filename = parts.length > 1 ? parts[1] : json.output_entity;
            }
          } catch (e) {
            // fallback: keep current filename
          }
        }

      if (!content.trim()) {
        alert("Please generate a recipe first!");
        return;
      }

      const blob = new Blob([content], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename + ".json";
      a.click();

      URL.revokeObjectURL(url);
    }

    window.onload = () => {
      addInput('inputs');
      toggleOptionalFields();
      setupExclusiveCheckboxes();
    };
</script>
</body>
</html>
