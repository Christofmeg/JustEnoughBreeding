import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.minecraftforge.gradle' version '6.+'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.+'
}

archivesBaseName = "${mod_id}-forge-${forge_supported_versions}"

minecraft {
    mappings channel: 'official', version: forge_minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    compileOnly project(":common")

    // JEI
    if (project.hasProperty('jei_version')) {
        compileOnly(fg.deobf("mezz.jei:jei-${forge_minecraft_version}-forge:${jei_version}"))
        compileOnly fg.deobf("me.shedaniel:REIPluginCompatibilities-forge-annotations:${rei_plugin_comp_version}")
        if (project.hasProperty('enable_jei') && project.enable_jei.toBoolean()) {
            runtimeOnly(fg.deobf("mezz.jei:jei-${forge_minecraft_version}-forge:${jei_version}"))
        }
    }

    // REI
    if (project.hasProperty('rei_version') && project.hasProperty('cloth_config_version') && project.hasProperty('architectury_version')) {
        compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")
        compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}")
        compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
        compileOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        if (project.hasProperty('enable_rei') && project.enable_rei.toBoolean()) {
            runtimeOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")
            runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
            runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        }
    }

    // EMI
    if (project.hasProperty('emi_version')) {
        compileOnly fg.deobf("curse.maven:emi-580555:${emi_version}")
        if (project.hasProperty('enable_emi') && project.enable_emi.toBoolean()) {
            runtimeOnly fg.deobf("curse.maven:emi-580555:${emi_version}")
        }
    }

    // JADE
    if (project.hasProperty('jade_version')) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_version}")
    }

    // CATALOGUE
    if (project.hasProperty('catalogue_version')) {
        runtimeOnly fg.deobf("curse.maven:catalogue-459701:${catalogue_version}")
    }

//    runtimeOnly fg.deobf("maven.modrinth:tag-tooltips:a0H0FGkF")
//    runtimeOnly fg.deobf("curse.maven:item-nbt-viewer-514135:4578522")

    runtimeOnly fg.deobf("maven.modrinth:companions-mod:p0AjmImh")
    runtimeOnly fg.deobf("maven.modrinth:geckolib:aVW7Z5da")
    runtimeOnly fg.deobf("maven.modrinth:knight-lib:pUsHCs18")

}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
    def expandProps = [
            "version": version,
            "group": project.group,
            "java_version": java_version,
            "minecraft_version": minecraft_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "minecraft_version_range": minecraft_version_range,

            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "forge_version_range": forge_version_range,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar.finalizedBy('reobfJar')

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = file('../../API Tokens/justenoughbreeding.md')
    def projectId = "${cf_id}".toString()
