import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.+'
}

base {
    archivesName = "${mod_id}-fabric-${fabric_supported_versions}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JEI
    if (project.hasProperty('jei_version')) {
        compileOnly ("mezz.jei:jei-${fabric_minecraft_version}-fabric-api:${jei_version}")
        if (project.hasProperty('enable_jei') && project.enable_jei.toBoolean()) {
            localRuntime("mezz.jei:jei-${fabric_minecraft_version}-fabric:${jei_version}")
        }
    }

    // REI
    if (project.hasProperty('rei_version') && project.hasProperty('cloth_config_version') && project.hasProperty('architectury_version')) {
        compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
        compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
        api "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
        api "dev.architectury:architectury-fabric:${architectury_version}"
        if (project.hasProperty('enable_rei') && project.enable_rei.toBoolean()) {
            localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
        }
    }

}

